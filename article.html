<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="description" content="为 AI 辅助独立游戏开发者整理值得读的资讯、可以实践的教程、趁手的工具与值得验证的创意。">
  <title>阅读文章 · AI × INDIE LAB</title>

</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="./" aria-label="AI × INDIE LAB 首页">AI <span>×</span> INDIE LAB</a>
    <div class="header-actions">
      <label class="section-picker"><span class="sr-only">选择栏目</span><select id="section-select" aria-label="选择栏目"><option value="all">All · 全部</option><option value="news">AI 资讯</option><option value="learn">AI 学习</option><option value="tools">游戏工具</option><option value="ideas">游戏创意</option></select></label>

  </div></header>
  <main id="main" class="reading-shell" tabindex="-1">
