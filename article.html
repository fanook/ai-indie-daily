<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="description" content="为 AI 辅助独立游戏开发者整理值得读的资讯、可以实践的教程、趁手的工具与值得验证的创意。">
  <title>阅读文章 · AI × INDIE LAB</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=7">
  <script src="./app.js?v=7" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="./" aria-label="AI × INDIE LAB 首页">AI <span>×</span> INDIE LAB</a>
    <div class="header-actions">
      <label class="section-picker"><span class="sr-only">选择栏目</span><select id="section-select" aria-label="选择栏目"><option value="all">全部</option><option value="news">AI 资讯</option><option value="learn">AI 学习</option><option value="tools">游戏工具</option><option value="ideas">游戏创意</option></select></label>
      <button id="shuffle" class="shuffle-button" aria-label="打乱当前栏目的文章顺序" title="Shuffle · 打乱顺序"><span>Shuffle</span></button>
    </div>
  </div></header>
  <main id="main" class="reading-shell" tabindex="-1">
    <article id="article" aria-busy="true"><div class="state-message">正在读取文章…</div></article>
    <noscript><p class="state-message">请启用 JavaScript 以阅读文章。</p></noscript>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
