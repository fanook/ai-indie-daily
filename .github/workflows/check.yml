name: Validate site and content
on:
  push:
    branches: [main, redesign/compact-articles]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/validate.mjs
      - run: npm test
      - run: npm run build
      - name: Build with the same Jekyll engine as GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: node scripts/verify-pages.mjs
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Use runner-provided Chrome
        run: google-chrome --version
      - name: Browser checks across mobile and desktop
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 --directory dist &
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
