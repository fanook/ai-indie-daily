name: Collect RSS candidates (manual)

# Daily editorial content is maintained by the user's scheduled model session.
# This optional utility creates an artifact for review; it does not publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/update.py --output /tmp/news-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: rss-candidates
          path: /tmp/news-candidates.json
          retention-days: 7
