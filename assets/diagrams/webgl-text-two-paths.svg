<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 578" role="img" aria-labelledby="title desc">
  <title id="title">同样宽的画面，两条成像路线</title>
  <desc id="desc">在设备像素比为三的示例中，HTML 文字可直接按 1170 个设备像素宽绘制；低分辨率 WebGL 先绘制 390 个像素宽，再放大到 1170，边缘的采样精度已受第一步限制。</desc>
  <style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .heading{font-size:34px;font-weight:680;fill:#292823}.label{font-size:28px;fill:#292823;font-weight:650}.note{font-size:24px;fill:#564e44}.tag{font-size:24px;font-weight:650;fill:#874a32}</style>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#ddd2c0" stroke-width="1"/></pattern>
    <pattern id="grid2" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d8baa8" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="600" height="578" rx="18" fill="#f3ecdf"/>
  <path d="M28 43h24" stroke="#bc674a" stroke-width="4" stroke-linecap="round"/>
  <text class="heading" x="28" y="94">同样宽的画面，两条成像路线</text>
  <text class="note" x="28" y="133">页面宽 390 CSS 像素，设备像素比 3</text>
  <rect x="28" y="159" width="544" height="166" rx="12" fill="#faf6ee" stroke="#d9cdbd"/>
  <text class="label" x="52" y="205">HTML 文字</text>
  <text class="note" x="52" y="249">浏览器直接绘制</text>
  <text class="note" x="52" y="285">显示宽度 1170 像素</text>
  <g transform="translate(422 186)">
    <rect width="108" height="108" rx="4" fill="#eee6d8"/>
    <path d="M0 90H18V72H36V54H54V36H72V18H90V0H108V36H90V54H72V72H54V90H36V108H0z" fill="#3d3b36"/>
    <rect width="108" height="108" fill="url(#grid)"/>
  </g>
  <rect x="28" y="345" width="544" height="166" rx="12" fill="#f5e3d6" stroke="#d9b9a6"/>
  <text class="label" x="52" y="391">WebGL 内的文字</text>
  <text class="note" x="52" y="435">只画 390 像素，再放大</text>
  <text class="tag" x="52" y="471">显示宽度 1170 像素</text>
  <g transform="translate(422 372)">
    <rect width="108" height="108" rx="4" fill="#eee0d0"/>
    <path d="M0 72h36V36h36V0h36v36H72v36H36v36H0z" fill="#8a6c5c"/>
    <path d="M36 72h36V36h36v36H72v36H36z" fill="#b78468"/>
    <rect width="108" height="108" fill="url(#grid2)"/>
  </g>
  <text class="note" x="28" y="553">右侧是笔画边缘示意，不按像素比例绘制。</text>
</svg>
