<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="墨蓝与浅灰绿的交界，一条首尾相连的环在两个色面之间反色">
<defs>
  <path id="field" d="M0 0H1200V198L0 441Z"/>
  <path id="return" fill-rule="evenodd" transform="rotate(-19 600 338)" d="M589 124C776 122 924 202 926 322C928 445 796 543 609 548C420 553 274 468 274 343C274 220 401 126 589 124ZM606 217C476 217 371 274 371 346C371 415 474 458 602 453C728 448 825 393 825 324C825 256 733 217 606 217Z"/>
  <clipPath id="upper"><use href="#field"/></clipPath>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" seed="29" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <g id="art">
    <rect width="1200" height="675" fill="#c8d0b4"/>
    <use href="#field" fill="#263f44"/>
    <use href="#return" fill="#263f44"/>
    <use href="#return" fill="#c8d0b4" clip-path="url(#upper)"/>
  </g>
</defs>
<use href="#art"/>
<use href="#art" filter="url(#grain)" opacity=".2"/>
</svg>
