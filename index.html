<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b101a"><title>AI × INDIE LAB | 开发者情报站</title><style>:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b101a;color:#f2f4f8}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #253041;background:#101826;position:sticky;top:0;z-index:2}.bar{max-width:1100px;margin:auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.07em}.brand span{color:#8eabff}.status{color:#91a2bb;font-size:12px}main{max-width:1100px;margin:auto;padding:58px 24px}.eyebrow{font-size:12px;letter-spacing:.2em;color:#8fa7d9;font-weight:700}.hero h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.045em;line-height:1.1;margin:16px 0}.hero p{color:#a8b7ce;max-width:650px;line-height:1.8}.tabs{display:flex;gap:8px;overflow-x:auto;margin:38px 0 24px;border-bottom:1px solid #273449;padding-bottom:14px}.tab{cursor:pointer;white-space:nowrap;background:transparent;border:0;color:#a8b7ce;padding:11px 17px;border-radius:9px;font-weight:700}.tab.active{background:#293a59;color:#e9f0ff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.toolbar h2{font-size:20px;margin:0}.toolbar input{background:#151e2d;border:1px solid #344158;color:#fff;border-radius:10px;padding:12px 14px;min-width:220px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}.card{background:#151e2c;border:1px solid #29364b;border-radius:17px;padding:23px;transition:border-color .2s}.card:hover{border-color:#5476ad}.meta{font-size:12px;color:#93a7c4;display:flex;justify-content:space-between}.card h3{font-size:20px;line-height:1.4;margin:17px 0 10px}.card .summary{color:#b3c1d4;line-height:1.75;font-size:14px}.details{margin-top:18px;padding-top:18px;border-top:1px solid #344055;color:#d0d9e6;line-height:1.8;font-size:14px}.details strong{color:#fff}.details a{color:#a9c1ff}.toggle{margin-top:14px;background:#263b60;border:1px solid #3b5886;color:#dce7ff;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:650}.empty{padding:38px;border:1px dashed #40506a;border-radius:15px;color:#9eb0c9}.foot{margin-top:65px;padding-top:25px;border-top:1px solid #263347;color:#8d9db5;font-size:13px}@media(max-width:600px){main{padding:36px 17px}.bar{padding:17px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}.tabs{margin-top:28px}}</style></head><body><header><div class="bar"><div class="brand">AI <span>×</span> INDIE LAB</div><div class="status">独立开发者情报站</div></div></header><main><section class="hero"><div class="eyebrow">DISCOVER · LEARN · BUILD</div><h1>为独立开发者<br>筛选真正有价值的信息。</h1><p>从 AI 前沿到游戏创意，把资讯、教程、工具与灵感汇集在同一个地方。只看重点，需要时再深入。</p></section><nav class="tabs" id="tabs"></nav><div class="toolbar"><h2 id="section"></h2><input id="search" placeholder="搜索标题、关键词…" aria-label="搜索资讯"></div><section class="cards" id="cards"></section><footer class="foot">AI × INDIE LAB · 内容保留发布日期与原始来源 · <span id="updated">等待内容更新</span></footer></main><script>const tabs=[['news','AI 资讯'],['learn','AI 学习'],['tools','游戏工具'],['ideas','游戏创意']];let active='news',items=[];const el=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){el('tabs').innerHTML=tabs.map(([id,name])=>'<button class="tab '+(active===id?'active':'')+'" data-tab="'+id+'">'+name+'</button>').join('');el('section').textContent=tabs.find(x=>x[0]===active)[1];const q=el('search').value.toLowerCase();const list=items.filter(x=>x.category===active&&(x.title+' '+x.summary+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));el('cards').innerHTML=list.length?list.map(x=>'<article class="card"><div class="meta"><span>'+safe(x.label||'精选')+'</span><time>'+safe(x.date)+'</time></div><h3>'+safe(x.title)+'</h3><div class="summary">'+safe(x.summary)+'</div><button class="toggle" aria-expanded="false">展开详情 ↓</button><div class="details" hidden><p><strong>事实与背景</strong><br>'+safe(x.facts||'')+'</p><p><strong>开发者价值</strong><br>'+safe(x.value||'')+'</p><p><strong>行动建议</strong><br>'+safe(x.action||'')+'</p>'+(x.url?'<a href="'+safe(x.url)+'" target="_blank" rel="noopener noreferrer">查看原始来源 ↗</a>':'')+'</div></article>').join(''):'<div class="empty">此栏目正在整理内容。新增条目会按日期自动归档。</div>';document.querySelectorAll('.toggle').forEach(btn=>btn.addEventListener('click',()=>{const detail=btn.nextElementSibling;detail.hidden=!detail.hidden;btn.setAttribute('aria-expanded',String(!detail.hidden));btn.textContent=detail.hidden?'展开详情 ↓':'收起详情 ↑'}))}el('tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){active=t.dataset.tab;render()}});el('search').addEventListener('input',render);fetch('./data/news.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(d=>{items=Array.isArray(d.items)?d.items:[];el('updated').textContent='更新于 '+(d.updated||'未知');render()}).catch(()=>{el('updated').textContent='内容暂不可用';render()});render();</script></body></html>
