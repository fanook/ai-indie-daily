<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f9fb">
  <meta name="description" content="为 AI 辅助独立游戏开发者整理值得读的资讯、可以实践的教程、趁手的工具与值得验证的创意。">
  <title>AI × INDIE LAB · 独立游戏开发者的每日阅读</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="./theme.js?v=5"></script><script src="./app.js?v=5" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="AI × INDIE LAB 首页"><span>AI <span class="brand-times">×</span> INDIE <strong>LAB</strong></span></a>
      <div class="header-actions">
        <a class="saved-link" id="saved-link" href="?saved=1"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg><span>收藏</span><span id="saved-count" class="saved-count">0</span></a>
        <button class="icon-button" id="theme-toggle" aria-label="切换至深色模式" title="切换主题"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.4 13A8.5 8.5 0 0 1 11 3.6 8.5 8.5 0 1 0 20.4 13Z"/></svg></button>
      </div>
    </div>

  </header>
  <main id="main" class="main-shell" tabindex="-1">
    <section class="section-heading" aria-labelledby="heading">
      <div><h1 id="heading">AI 资讯</h1></div>
      <p class="update-label" id="updated">正在读取内容</p>
    </section>
    <div class="browse-bar">

    <form class="toolbar" role="search" id="search-form">
      <label class="section-picker"><span class="sr-only">选择栏目</span><select id="section-select" aria-label="选择栏目"><option value="" disabled>选择栏目</option><option value="news">AI 资讯</option><option value="learn">AI 学习</option><option value="tools">游戏工具</option><option value="ideas">游戏创意</option></select></label>
      <label class="search-box"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="sr-only">搜索当前栏目</span><input id="search" type="search" autocomplete="off" placeholder="搜索内容"></label>
      <div class="filter-controls">
        <label class="select-box"><span class="sr-only">分类筛选</span><select id="category"><option value="">全部分类</option></select></label>
        <label class="archive-select"><span class="sr-only">历史月份</span><select id="month"><option value="">全部时间</option></select></label>
        <label class="select-box"><span class="sr-only">日期排序</span><select id="order"><option value="new">最新优先</option><option value="old">最早优先</option></select></label>
      </div>
      <div class="view-toggle" role="group" aria-label="展示方式">
        <button type="button" data-view="grid" class="icon-button" aria-label="图文网格" aria-pressed="true" title="图文网格"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
        <button type="button" data-view="list" class="icon-button" aria-label="纯文字列表" aria-pressed="false" title="纯文字列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      </div>
    </form>
    </div>
    <div class="list-toolbar"><span id="result-count" role="status" aria-live="polite">正在加载…</span><button class="text-button" id="reset-filters" hidden>清除筛选</button></div>
    <section id="cards" class="article-list" data-view="grid" aria-label="文章列表" aria-busy="true"><div class="state-message">正在读取文章…</div></section>
    <div class="pagination" id="pagination" hidden><button class="secondary-button" id="load-more">加载更多</button><span id="page-progress"></span></div>
    <noscript><p class="state-message">请启用 JavaScript 以浏览文章，也可以在 <a href="https://github.com/fanook/ai-indie-daily/blob/main/data/news.json">GitHub 阅读内容数据</a>。</p></noscript>
  </main>
  <footer class="site-footer"><span>AI × INDIE LAB</span><a href="https://github.com/fanook/ai-indie-daily" target="_blank" rel="noopener noreferrer">内容与源码 ↗</a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
